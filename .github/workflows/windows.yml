name: Windows verification
# Tests run only on an explicit manual request. Extra coverage is opt-in too.
on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Run desktop UI and QR checks on the CI machine
        type: boolean
        default: false
      extended:
        description: Include 150% scaling and all desktop languages (requires desktop)
        type: boolean
        default: false
      slow:
        description: Include the real 61-second pairing expiry wait
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/NeonManagerR6/Qt
          key: qt-6.8.3-msvc2022-x64-${{ hashFiles('setup-qt.ps1') }}
      - name: Install pinned Qt kit
        shell: pwsh
        run: |
          if (!(Test-Path "$env:LOCALAPPDATA/NeonManagerR6/Qt/6.8.3/msvc2022_64/bin/qmake.exe")) { ./setup-qt.ps1 }
      - name: Build and check core, HTTP, restart, and single-instance behavior
        shell: pwsh
        run: |
          if ('${{ inputs.slow }}' -eq 'true') { ./build.cmd test --slow }
          else { ./build.cmd test }
          exit $LASTEXITCODE
      - name: Requested desktop and QR checks
        if: ${{ inputs.desktop }}
        shell: pwsh
        run: |
          python -m pip install opencv-python-headless
          if ('${{ inputs.extended }}' -eq 'true') { python tests/run_checks.py --ui-only --qr-scan --full }
          else { python tests/run_checks.py --ui-only --qr-scan }
          exit $LASTEXITCODE
      - name: Upload verification reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          include-hidden-files: true
          path: |
            .build/verification/**/ui-verification.json
            .build/verification/**/http-verification.json
            .build/verification/**/restart-verification.json
            .build/verification/**/preferences-restart-verification.json
            .build/verification/**/recovery-verification.json
            .build/verification/**/qr-scan-verification.json
            .build/verification/**/*.png
            !.build/verification/**/qr-revealed.png
            !.build/verification/**/qr-revealing.png
            !.build/verification/**/qr-concealing.png
            !.build/verification/**/phone-*.png
            !.build/verification/**/pairing.png
            !.build/verification/**/pairing-options.png
          if-no-files-found: ignore
