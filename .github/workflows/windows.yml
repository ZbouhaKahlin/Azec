name: Windows verification
# Manual only: this private repository's GitHub Actions jobs cannot start while
# the account has a failed payment or a spending limit that blocks minutes
# ("The job was not started because recent account payments have failed").
# Automatic push/pull_request triggers therefore only produced failing checks.
# Restore the previous trigger list once Actions billing is working again.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/NeonManagerR6/Qt
          key: qt-6.8.3-msvc2022-x64
      - name: Install pinned Qt kit
        shell: pwsh
        run: |
          if (!(Test-Path "$env:LOCALAPPDATA/NeonManagerR6/Qt/6.8.3/msvc2022_64/bin/qmake.exe")) { ./setup-qt.ps1 }
      - name: Build and check core, HTTP, restart, and single-instance behavior
        shell: pwsh
        run: ./build.cmd test --slow
      - name: Verify Goofy at 100% and 150%
        shell: pwsh
        run: |
          python -m pip install opencv-python-headless
          python tests/run_checks.py --ui-only --qr-scan --full
      - name: Upload verification reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          include-hidden-files: true
          path: |
            .build/verification/**/ui-verification.json
            .build/verification/**/http-verification.json
            .build/verification/**/restart-verification.json
            .build/verification/**/preferences-restart-verification.json
            .build/verification/**/recovery-verification.json
            .build/verification/**/qr-scan-verification.json
            .build/verification/**/*.png
            !.build/verification/**/qr-revealed.png
            !.build/verification/**/phone-branded.png
          if-no-files-found: ignore
